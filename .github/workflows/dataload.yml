# Every hour, on GitHub's machine instead of the PC: collect 7 of the 8 sources, take CPCB from the PC (GitHub cannot
# reach the CPCB site; the PC pushes its files to the `cpcb` branch), rebuild the district_intel store and upload it to
# AWS. The website (DATA_BACKEND=aws) picks up the new build within 5 minutes.
#
# Started every hour by cron-job.org through the API (workflow_dispatch; see README). GitHub's own schedule is only a
# backup: it skips many runs (3 of 12 hours ran on 3-4 Oct 2026). Whatever starts it, a run first checks whether
# this clock hour's build is already on AWS and stops there if so, so extra starts cost a few seconds.
#
# The code (pipeline, collectors, generators) is taken from the main repo ApshanaSP/farmwisenew at the start of every
# run; this repository keeps only the workflow, ci/ and aws/.
#
# Needs one repository secret: REFRESH_API_KEY (the team API key; it never expires, and no AWS keys are used).
# Optional: GROQ_API_KEY (AI news labelling) and GEMINI_API_KEY (AI page 2 briefing); without them the rules are used.
# Between runs, the collectors' history lives in the `state` release (ci/state.py); the first run starts from the
# `seed` branch's copy of the PC's state when there is no release yet.
name: Hourly data load

on:
  schedule:
    - cron: "17 * * * *"   # backup for the cron-job.org call (GitHub starts scheduled runs late or not at all)
  workflow_dispatch:       # cron-job.org every hour, the Collector console's Refresh, and the "Run workflow" button
    inputs:
      force:
        description: "Run even if this hour's build is already on AWS"
        type: boolean
        default: false

permissions:
  contents: write          # to save the state release

concurrency:
  group: dataload
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - name: Is this hour's build already on AWS?
        id: due
        env:
          REFRESH_API_KEY: ${{ secrets.REFRESH_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          hour = datetime.now(ZoneInfo("Asia/Kolkata")).strftime("%Y-%m-%d %H")
          built = ""
          try:
              req = urllib.request.Request("https://i6q6oi20lb.execute-api.ap-south-1.amazonaws.com/intel/snapshot",
                                           data=b"{}", method="POST", headers={"content-type": "application/json",
                                           "x-refresh-key": os.environ.get("REFRESH_API_KEY", "").strip()})
              with urllib.request.urlopen(req, timeout=60) as r:
                  built = json.loads(r.read()).get("built_at", "")  # IST wall clock, like this hour
          except Exception as e:  # noqa: BLE001  (unreadable: run, and let the load job report the problem)
              print(f"could not read the build AWS serves ({e})")
          due = os.environ.get("FORCE") == "true" or not built.startswith(hour)
          print(f"AWS serves the build from {built or 'unknown'}; now {hour}:xx IST -> "
                + ("run" if due else "skip: this hour's build is already there"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"due={str(due).lower()}", file=f)
          EOF

  load:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      # Temporary MySQL for the grievance generator only; thrown away when the job ends
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only"
          --health-interval=5s --health-timeout=5s --health-retries=30

    env:
      TZ: Asia/Kolkata                       # the collectors and generators keep IST wall-clock time
      PYTHONIOENCODING: utf-8
      REFRESH_API_KEY: ${{ secrets.REFRESH_API_KEY }}
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci-only
      DB_NAME: district_collector_dashboard
      HF_HOME: ${{ github.workspace }}/.hf   # the multilingual-e5-small model, cached between runs
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4          # this repository: the workflow, ci/ and aws/ only

      # The code comes from the main repo (ApshanaSP/farmwisenew, branch main), so there is one copy of the pipeline,
      # the collectors and the generators: a fix pushed there is live on the next hourly run. Only code paths are
      # taken; the data comes from the saved state below. The grievance generator's slim package.json stays here.
      - name: Take the code from the main repo
        uses: actions/checkout@v4
        with:
          repository: ApshanaSP/farmwisenew
          ref: main
          path: .main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /district_intel/
            !/district_intel/output/
            !/district_intel/docs/
            /chennai_news_pipeline/
            !/chennai_news_pipeline/data/
            /imd_weather_collector/imd_weather_collector.py
            /cpcb_air_quality_collector/cpcb_air_quality_collector.py
            /cfm_dss_collector/cfm_dss_collector.py
            /chennai_hospital_data/chennai_hospital_data_generator.py
            /pwd_dataset_generator/generate_pwd_data.py
            /police_dataset_generator/
            !/police_dataset_generator/output/
            /chennai-grievance-portal-main/scripts/
            /chennai-grievance-portal-main/src/lib/ai-classifier.ts
            /chennai-grievance-portal-main/src/lib/constants.ts
            /chennai-grievance-portal-main/data/gcc-reference/
            /chennai-grievance-portal-main/data/boundaries/

      - name: Put the main repo's code in place
        run: |
          git -C .main log -1 --format="code from farmwisenew main %h (%ad): %s" --date=format:"%d %b %H:%M"
          rsync -a --exclude .git .main/ ./
          rm -rf .main

      - name: Check the API key secret
        run: |
          if [ -z "$(echo "$REFRESH_API_KEY" | tr -d "[:space:]")" ]; then
            echo "::error::Add the repository secret REFRESH_API_KEY (Settings > Secrets and variables > Actions)"; exit 1
          fi

      # Optional AI keys for the pipeline's news labelling (Groq) and page 2 briefing (Gemini), from the repository
      # secrets GROQ_API_KEY and GEMINI_API_KEY. The pipeline reads them only from district_intel/.env. Without a key it
      # uses the rule-based labels, so a missing or expired key never stops the hourly load.
      - name: AI keys (optional)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          : > district_intel/.env
          for k in GROQ_API_KEY GEMINI_API_KEY; do
            v="$(printenv "$k" | tr -d '[:space:]')"
            if [ -n "$v" ]; then echo "$k=$v" >> district_intel/.env; echo "$k: set"; else echo "$k: not set (rule-based)"; fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ci/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install Node packages
        run: |
          npm ci --prefix police_dataset_generator --no-audit --no-fund
          npm install --prefix chennai-grievance-portal-main --no-audit --no-fund

      - uses: actions/cache@v4
        with:
          path: .hf
          key: hf-multilingual-e5-small-v1

      - name: Restore the collectors' history
        run: |
          if gh release download state --pattern state.tar.gz --clobber; then
            python ci/state.py unpack state.tar.gz
          elif git fetch --depth 1 origin seed 2>/dev/null; then
            git show FETCH_HEAD:state.tar.gz > state.tar.gz
            python ci/state.py unpack state.tar.gz
            echo "first run: started from the seed branch"
          else
            echo "::warning::no saved state and no seed branch: starting from empty history"
          fi
          echo "STATE_OK=1" >> "$GITHUB_ENV"

      - name: Take CPCB from the PC
        run: |
          # GitHub's machines cannot reach airquality.cpcb.gov.in, so the PC collects CPCB every hour and pushes its
          # files to the `cpcb` branch (district_intel/scripts/push_cpcb.py in the main repo). They replace the copy
          # saved in the state, which nothing here updates.
          if git fetch --depth 1 origin cpcb 2>/dev/null; then
            git checkout FETCH_HEAD -- cpcb_air_quality_collector/data
            git log -1 --format="%s" FETCH_HEAD
          else
            echo "::warning::no cpcb branch yet: CPCB stays as last saved"
          fi

      - name: Load the grievance generator's MySQL from AWS
        run: bash ci/run.sh "MySQL seeding" python ci/seed_mysql.py

      - name: Collect all sources and rebuild the store
        run: |
          # the PC's config, with Linux's npm and no MySQL export
          sed -e 's/npm\.cmd/npm/' -e 's/export_after_build: true/export_after_build: false/' \
            district_intel/config.yaml > district_intel/config.ci.yaml
          # CPCB is left to the PC: GitHub's machines cannot connect to airquality.cpcb.gov.in (checked on run 4), so
          # here it only burned three timed-out tries every hour. The PC collects it and sends it with aws/push.py cpcb.
          bash ci/run.sh "Collection and build" python district_intel/run_pipeline.py refresh --all \
            --only news,imd,cfm,hospital,pwd,grievance,police --config district_intel/config.ci.yaml
          python - <<'EOF'
          import json
          st = json.load(open("district_intel/output/state/refresh_state.json"))
          last = st.get("_last_collection", {})
          print("sources:", ", ".join(last.get("ran", [])), "| failed:", ", ".join(last.get("failed", [])) or "none")
          for name in last.get("failed", []):
              print(f"::warning::{name} failed this run (retried next hour): " + st[name]["tail"].strip().splitlines()[-1][:200])
          EOF

      - name: Upload to AWS
        run: |
          bash ci/run.sh "Store upload" python aws/export_intel.py
          bash ci/run.sh "Police upload" python aws/push.py police

      - name: Save the collectors' history
        if: always() && env.STATE_OK == '1'
        run: |
          bash ci/run.sh "State save" python ci/state.py pack state.tar.gz
          gh release view state >/dev/null 2>&1 || gh release create state --title "Pipeline state" \
            --notes "Saved by the hourly workflow: what the collectors keep between runs (ci/state.py). Not a software release."
          gh release upload state state.tar.gz --clobber
