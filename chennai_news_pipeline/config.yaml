# =============================================================================
# Chennai District News Dataset Pipeline - configuration
# Every tunable value lives here. Secrets (API keys, DB passwords) go in .env.
# =============================================================================

timezone: Asia/Kolkata

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  state_file: data/state/pipeline_state.json
  classification_cache: data/state/classification_cache.json   # LLM answers (only used with an API key)
  log_dir: logs

run:
  # Normal daily run: Google News "when:" window. 2d = last 48 hours.
  daily_lookback: 2d
  daily_lookback_hours: 48          # used by API connectors (from= parameter)
  backfill_days: 90                 # first run / --backfill: fetch this many days back from the run date
  backfill_window_days: 5           # Google News backfill is split into windows of this size
  # Rolling window for data/processed/master_news.csv: each run drops rows whose article
  # date (published_date, else fetch date) is older than this many days before the run
  # date. 0 = keep everything. Dated per-run files in data/raw and data/processed are not touched.
  master_retention_days: 90
  # Timestamps without a timezone are assumed to be in this zone.
  naive_datetime_timezone: Asia/Kolkata

http:
  # Browser-compatible UA plus an identifying token. Some publishers (e.g. The Hindu)
  # drop connections from UAs that look like generic bots. Add a contact URL/e-mail
  # for your office in the parentheses if you want publishers to be able to reach you.
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36 (compatible; ChennaiDistrictNewsDataset/1.0)"
  robots_user_agent: ChennaiDistrictNewsDataset   # token matched against robots.txt rules
  timeout_seconds: 20
  retries: 3
  backoff_factor: 1.5               # sleeps 0s, 3s, 6s ... between retries
  retry_on_status: [429, 500, 502, 503, 504]
  default_min_interval_seconds: 1.0 # min gap between two requests to the same domain
  per_domain_min_interval_seconds:
    news.google.com: 1.0
  # Use the Windows/macOS certificate store (needed when antivirus software such as
  # Avast/Kaspersky inspects HTTPS, or behind corporate proxies). Requires `truststore`.
  use_system_trust_store: true

extraction:
  enabled: true
  respect_robots_txt: true
  max_workers: 6
  max_articles_per_run: 2500        # safety cap on article-page downloads per run
  min_body_chars: 200               # shorter extractions are treated as failed
  # Never download article pages from these domains (Google News links are redirects).
  skip_domains: [news.google.com]

language:
  tamil_ratio_threshold: 0.30       # share of Tamil-script letters to label a text "ta"
  # Latin-script text is "en" unless langdetect is this sure it is another language
  # (short headlines are often misdetected, so langdetect is not used below the length).
  other_latin_min_probability: 0.95
  other_latin_min_chars: 120
  sample_chars: 1500                # characters of title+body used for detection

url_cleaning:
  resolve_google_news_offline: true # decode old-style Google News links without any request
  tracking_params: [fbclid, gclid, dclid, msclkid, yclid, igshid, mc_cid, mc_eid, _ga,
                    ref, ref_src, ref_url, cmpid, ocid, oc, s_cid, pfrom, ito, rss, feed]
  tracking_param_prefixes: [utm_, at_, pk_, hsa_]

# -----------------------------------------------------------------------------
# SOURCES
# -----------------------------------------------------------------------------
google_news:
  enabled: true
  base_url: https://news.google.com/rss/search
  editions:
    en: {hl: en-IN, gl: IN, ceid: "IN:en"}
    ta: {hl: ta, gl: IN, ceid: "IN:ta"}
  queries:
    core:
      en: ["Chennai", "Greater Chennai Corporation", "Chennai Collector", "Chennai Metrowater"]
      ta: ["சென்னை", "சென்னை மாநகராட்சி", "சென்னை ஆட்சியர்", "சென்னை குடிநீர் வாரியம்"]
    topics:
      en: ["Chennai flood", "Chennai rain", "Chennai waterlogging", "Chennai water supply",
           "Chennai power cut", "Chennai road", "Chennai metro rail", "Chennai garbage",
           "Chennai hospital", "Chennai dengue", "Chennai protest", "Chennai accident",
           "Chennai fire", "Chennai crime", "Chennai school", "Chennai ration",
           "Chennai pension", "Chennai market prices", "Chennai cyclone"]
      ta: ["சென்னை வெள்ளம்", "சென்னை மழை", "சென்னை மழைநீர் தேக்கம்", "சென்னை குடிநீர்",
           "சென்னை மின்தடை", "சென்னை சாலை", "சென்னை மெட்ரோ ரயில்", "சென்னை குப்பை",
           "சென்னை மருத்துவமனை", "சென்னை டெங்கு", "சென்னை போராட்டம்", "சென்னை விபத்து",
           "சென்னை தீ விபத்து", "சென்னை குற்றம்", "சென்னை பள்ளி", "சென்னை ரேஷன்",
           "சென்னை ஓய்வூதியம்", "சென்னை காய்கறி விலை", "சென்னை புயல்"]
  # One query per gazetteer place (taluks / GCC zones / localities below).
  place_queries:
    enabled: true
    languages:
      taluks: [en, ta]
      zones: [en, ta]
      localities: [en]
    template_en: '"{name}" Chennai'   # {name} = English place name
    template_ta: '"{name}"'           # {name} = first Tamil alias

rss_feeds:
  - name: The Hindu
    url: https://www.thehindu.com/news/cities/chennai/feeder/default.rss
    language: en
  - name: Times of India
    url: https://timesofindia.indiatimes.com/rssfeeds/2950623.cms
    language: en
  - name: DT Next
    url: https://www.dtnext.in/api/v1/collections/newschennai-news.rss
    language: en
  - name: The New Indian Express
    url: https://www.newindianexpress.com/cities/chennai/rssfeed/?id=182&getXmlFeed=true
    language: en
  - name: Dinamani
    # Dinamani publishes a single all-stories feed (no Chennai-only feed as of Sep 2026);
    # the Chennai relevance filter narrows it down.
    url: https://www.dinamani.com/stories.rss
    language: ta

# Publishers without RSS: Google-News-style sitemaps of their latest stories.
sitemaps:
  - name: Dinamalar
    url: https://www.dinamalar.com/sitemap_latest.xml
    language: ta
    article_url_pattern: "/news/"     # sitemap entries not matching are not articles

# Optional connectors: used only when the key is present in .env.
api_sources:
  newsapi:
    env_key: NEWSAPI_KEY
    endpoint: https://newsapi.org/v2/everything
    queries: ["Chennai"]
    language: en
    page_size: 100
  gnews:
    env_key: GNEWS_API_KEY
    endpoint: https://gnews.io/api/v4/search
    queries: ["Chennai"]
    lang: en
    country: in
    max: 10                           # free plan limit per request

# -----------------------------------------------------------------------------
# CHENNAI RELEVANCE FILTER
# -----------------------------------------------------------------------------
relevance:
  # Removed from the text before place matching.
  exclusion_phrases:
    - Chennai Super Kings
    - சென்னை சூப்பர் கிங்ஸ்
    - Chennai Express
    - Chennai 600028
    - Madras Regiment
    - Madras eye
    - Madras Cafe
    - Madurai Bench of the Madras High Court
    - Madurai Bench of Madras High Court
    - Madras High Court Madurai Bench
    - Madras High Court's Madurai Bench
    - சென்னை உயர் நீதிமன்ற மதுரைக் கிளை
    - சென்னை உயர்நீதிமன்ற மதுரைக் கிளை
    - சென்னை உயர் நீதிமன்ற மதுரை கிளை
    - சென்னை உயர்நீதிமன்ற மதுரை கிளை
    # Manali (Himachal Pradesh) - the Chennai zone of the same name stays matchable
    - Kullu-Manali
    - Kullu Manali
    - Manali-Leh
    - Manali, Himachal
    - Manali in Himachal
  # first_mentioned_place may be the district name itself ("Chennai") when it
  # appears before any taluk/zone/locality.
  first_place_includes_district: true

# -----------------------------------------------------------------------------
# GAZETTEER
# Matching rules:
#   * English aliases: case-insensitive, whole words; spaces/dots/hyphens are flexible
#     ("T. Nagar" matches "T Nagar", "T.Nagar").
#   * Tamil aliases: must start a word; case suffixes are allowed (சென்னையில்).
#     An alias ending in pulli (்) also matches inflected forms (மயிலாப்பூரில்).
#   * requires_context: true -> the place is listed when mentioned, but on its own it
#     does NOT make an article Chennai-relevant (names shared with other districts/states).
#   * ta_block_suffixes: Tamil continuations that make the match a different word.
# Coordinates are approximate centroids for map placement - refine as needed.
# -----------------------------------------------------------------------------
gazetteer:
  district:
    name: Chennai
    latitude: 13.0827
    longitude: 80.2707
    aliases_en: [Chennai, Madras, Greater Chennai Corporation, CMWSSB, Chennai Metrowater, Ripon Building]
    aliases_ta: [சென்னை, மெட்ராஸ், மதராஸ்]

