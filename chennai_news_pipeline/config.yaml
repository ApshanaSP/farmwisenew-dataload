    negative_en: [inaugurate, launch, unveil, sanction, allocate, award, felicitate, celebrate, festival,
                  arrested, murder, booked, remanded, sentenced, acquitted, police, detained, custody,
                  FIR, POCSO, assault, scheduled, maintenance work, power shutdown, to face, to witness,
                  full list, list of areas, grievance meeting, grievances meeting, to be held,
                  tomorrow, areas to, localities, locations to]
