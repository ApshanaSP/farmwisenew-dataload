# -----------------------------------------------------------------------------
# CLASSIFICATION: department + complaint flag (runs on Chennai-relevant rows)
# -----------------------------------------------------------------------------
classification:
  enabled: true
  text_max_chars: 1500              # title + summary + body characters used
  # Used when no model can place an article (crime, politics, cinema ...).
  # Such rows carry department_method = "fallback".
  fallback_department: General Administration
  # Blanked out before department matching: names that merely contain department words.
  ignore_phrases: [பள்ளிக்கரணை, Pallikaranai, Chennai Petroleum Corporation, CHENNPETRO, real estate,
                   Prestige Estates, Estates, Chennai Super Kings, Tower Park Road, பட்டாக் கத்தி,
                   பட்டா கத்தி, பட்டாக்கத்தி]

  keyword_model:
    strong_weight: 2                # en / ta terms
    weak_weight: 1                  # en_weak / ta_weak terms
    title_weight: 2                 # a term in the title counts this many times
    min_weak_terms: 2               # without a strong term, need this many different weak terms
    # For articles already flagged as complaints, one weak term is informative
    # ("uneven road" complaint -> Engineering), so the bar is lowered.
    min_weak_terms_for_complaints: 1

  embedding_model:                  # offline zero-shot for English rows with no keyword hit.
    # Disabled: on the 90-day data, headlines without department keywords were mostly
    # crime/politics/prices and MiniLM forced them into departments at low similarity
    # ("Electrician hacked to death" -> Electrical). Enable only with a better model.
    enabled: false
    model: sentence-transformers/all-MiniLM-L6-v2   # must already be in the local HF cache
    min_similarity: 0.40
    languages: [en]

  llm:                              # optional; used only when the key is in .env
    enabled: true
    env_key: OPENAI_API_KEY
    endpoint: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini
    batch_size: 20
    max_items_per_run: 20000
    timeout_seconds: 60

  complaint:
    threshold: 2                    # score needed (and at least one grievance/problem cue)
    grievance_weight: 2             # strong civic-grievance wording
    grievance_weak_weight: 1        # grievance words that also appear in politics / crime stories
    problem_weight: 1
    negative_weight: 2              # announcements, scheduled notices, crime reports
    grievance_en: [complain, woes, plight, irked, apathy, neglect, no action, despite complaints,
                   poor maintenance, poorly maintained, menace, inconvenience, hardship, ordeal,
                   nightmare, bear the brunt, left in the lurch, cry for help, residents rue, fume,
                   residents demand, residents urge, Citizen Connect, decry]
    grievance_weak_en: [complaint, grievance, allege, demand, urge, petition, protest, agitation,
                        road roko, suffer, anger, struggle, trouble, hassle, lack of]
    grievance_ta: [அவதி, தவிப்பு, அலட்சியம், கண்டுகொள்ளாத, நடவடிக்கை எடுக்கப்படவில்லை, தொல்லை, வேதனை]
    grievance_weak_ta: [புகார், கோரிக்கை, போராட்டம், ஆர்ப்பாட்டம், மறியல், முற்றுகை, குற்றச்சாட்டு,
                        குற்றம்சாட்டு, அதிருப்தி, சிரமம், நடவடிக்கை இல்லை]
    problem_en: [overflowing, overflow, stagnant, stagnation, waterlogged, waterlogging, inundated,
                 submerged, damaged, broken, pothole, potholed, crater, dilapidated, crumbling,
                 caved in, cave-in, collapse, unattended, uncleared, not cleared, clogged, choked,
                 pile up, piled up, dumped, stench, foul smell, stray dog, stray cattle, shortage,
                 scarcity, no water, erratic supply, power cut, power outage, outage, dark stretch,
                 non-functional, defunct, not working, leak, leakage, contaminated, sewage, delayed,
                 incomplete, abandoned, unsafe, encroachment, traffic snarl, dug up, left open,
                 open drain, exposed wire, snapped wire, mosquito]
    problem_ta: [தேங்கி, தேக்கம், சேதமடைந்த, சேதம், பழுதடைந்த, பழுது, குண்டும் குழியுமாக, பள்ளம்,
                 துர்நாற்றம், நிரம்பி வழி, அகற்றப்படாத, அகற்றாமல், தட்டுப்பாடு, மின்தடை, மின்வெட்டு,
                 இருளில், கசிவு, உடைந்த, சீரமைக்கப்படாத, ஆக்கிரமிப்பு, கழிவுநீர், அபாயம், ஆபத்தான,
