# Unified incident categories.
#   base_severity   0-100 starting point for sources without their own severity (news, overlay)
#   sla_h           hours to resolve, by severity (Severe, High, Medium, Low)
#   sla_basis       resolution (default) or response: police cases stay under investigation for weeks,
#                   so their deadline is on the first response, not on closure
#   link_window_h   max hours between two reports of the same incident
#   link_radius_m   max distance between two reports of the same incident
#   support         departments that usually have to act as well (coordination)
#   keywords_en/ta  news cues; a strong cue alone is enough, weak cues need two hits
